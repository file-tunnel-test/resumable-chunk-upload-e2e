name: DEN-3431 encrypted object storage certification

on:
  pull_request:
    paths:
      - 'den-3431/**'
      - '.github/workflows/den-3431-object-storage-certification.yml'
  push:
    branches: [main]
    paths:
      - 'den-3431/**'
      - '.github/workflows/den-3431-object-storage-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: den-3431-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-synthetic-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact test-org head without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, Node 24
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false
          show-progress: false
      - name: Check out exact backend source pin
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, Node 24
        with:
          repository: file-tunnel/ftnl-backend-api.rs
          ref: f33d79896584a4a2fa4dcde88f0cd4cf863e11cb
          path: source/backend
          persist-credentials: false
          show-progress: false
      - name: Check out exact clients source pin
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, Node 24
        with:
          repository: file-tunnel/ftnl-clients
          ref: dfd339f238932b7ed209b677916f9fcb8d249670
          path: source/clients
          persist-credentials: false
          show-progress: false
      - name: Prove exact head and source-pin contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git -C source/backend rev-parse HEAD)" = f33d79896584a4a2fa4dcde88f0cd4cf863e11cb
          test "$(git -C source/clients rev-parse HEAD)" = dfd339f238932b7ed209b677916f9fcb8d249670
          node -e '
            const p=require("./den-3431/source-pins.json");
            if(p.schema!=="file-tunnel-test/source-pins/v1"||p.sources.length!==2)process.exit(1);
            for(const s of p.sources)if(!/^[0-9a-f]{40}$/.test(s.sha))process.exit(1);
          '
      - name: Run local state-machine, fault, mutation, and evidence tests
        run: node --test den-3431/test/*.test.mjs
      - name: Generate deterministic redacted evidence
        run: |
          mkdir -p evidence
          DEN3431_EXACT_HEAD_SHA="$EXPECTED_HEAD_SHA" \
            node den-3431/scripts/run-certification.mjs evidence/den-3431.json
          node den-3431/scripts/verify-evidence.mjs evidence/den-3431.json
      - name: Cross-language evidence parity
        shell: bash
        run: |
          set -euo pipefail
          python3 den-3431/parity/verify.py evidence/den-3431.json
          go run den-3431/parity/verify.go evidence/den-3431.json
          javac -d "$RUNNER_TEMP/den3431-java" den-3431/parity/Verify.java
          java -cp "$RUNNER_TEMP/den3431-java" Verify evidence/den-3431.json
          rustc -D warnings den-3431/parity/verify.rs -o "$RUNNER_TEMP/den3431-rust"
          "$RUNNER_TEMP/den3431-rust" evidence/den-3431.json
      - name: Reject retained secrets, signed URLs, identifiers, and content
        shell: bash
        run: |
          set -euo pipefail
          ! grep -ERn 'X-Amz-(Credential|Signature)|Authorization: Bearer|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|synthetic-only:|fixture-bucket|synthetic-object|tenant-a|tenant-b' evidence
          test "$(find evidence -type f | wc -l)" -eq 1
      - name: Upload exact-head evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: den-3431-object-storage-evidence-${{ env.EXPECTED_HEAD_SHA }}
          path: evidence/den-3431.json
          if-no-files-found: error
          retention-days: 30
